# Model registry entry: the configuration this model was evaluated in (docs/evaluation_policy.md).
# scripts/evaluate_model.py --config models/nemotron-3-ultra.yaml runs it; scripts/leaderboard.py reads it with its result card.
id: nemotron-3-ultra
display_name: Nemotron 3 Ultra
model: "openrouter:nvidia/nemotron-3-ultra-550b-a55b"  # the harness model name: picks the route (llm.py) and the run folder
developer: NVIDIA
open_weights: true
status: verified  # run by the maintainers on all 240 scenarios with the pinned harness, partners, judges and readings
access:
  provider: openai_compat
  endpoint: https://openrouter.ai/api/v1/chat/completions
  api_model_id: nvidia/nemotron-3-ultra-550b-a55b
  key_env: OPENROUTER_API_KEY  # the variable that holds the key, never the key
  data_policy: "OpenRouter, only zero-data-retention endpoints that do not collect data (llm.py OPENROUTER_PROVIDER_POLICY); pinned to BaseTen, NVIDIA's NVFP4 release (provider.only, no fallback), so every run uses the same host and quantisation"
reasoning:
  label: lightest  # the default row: the lightest reasoning setting the API offers
  sent: {"reasoning": {"effort": "none"}}
  defined_in: env HARNESS_OPENAI_COMPAT (as llm.py _openrouter_lightest picks it)
  probed: "2026-10-20"
  why: "reasoning can be turned off"
price_usd_per_mtok: [0.6, 2.4]  # input, output
price_note: "BaseTen's price on OpenRouter, 2026-10-20"
env: {"HARNESS_OPENAI_COMPAT": {"openrouter:nvidia/nemotron-3-ultra-550b-a55b": {"extra": {"reasoning": {"effort": "none"}, "provider": {"only": ["baseten"], "quantizations": ["fp4"], "allow_fallbacks": false}}, "price": [0.6, 2.4]}}}  # extra harness environment (HARNESS_OPENAI_COMPAT, HARNESS_OPENAI_EFFORT, HARNESS_PRICES); no keys
budget_usd: 120  # spend cap for one full pass (three test seeds): the model, partners, judges and readings
evaluation:
  scored_set: benchmark/final_set.json
  runs: ["2026-10-21", "2026-10-21"]  # first and last day (UTC) of the scored runs
  benchmark_version: "4.0.0"
  card: results/cards/nemotron-3-ultra.json
notes: "OpenRouter's three zero-retention hosts serve different quantisations (DeepInfra and BaseTen fp4, Venice fp8), so the runs are pinned to one."
