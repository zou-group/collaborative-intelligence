# Model registry entry: the configuration this model was evaluated in (docs/evaluation_policy.md).
# scripts/evaluate_model.py --config models/qwen-3.7-max.yaml runs it; scripts/leaderboard.py reads it with its result card.
id: qwen-3.7-max
display_name: Qwen 3.7 Max
model: "together:Qwen/Qwen3.7-Max"  # the harness model name: picks the route (llm.py) and the run folder
developer: Alibaba (Qwen)
open_weights: true
status: verified  # run by the maintainers on all 240 scenarios with the pinned harness, partners, judges and readings
access:
  provider: together
  endpoint: https://api.together.xyz/v1/chat/completions
  api_model_id: Qwen/Qwen3.7-Max
  key_env: TOGETHER_API_KEY  # the variable that holds the key, never the key
  data_policy: "Together AI serverless; data sharing with the model's provider kept off in the account"
reasoning:
  label: lightest  # the default row: the lightest reasoning setting the API offers
  sent: {"reasoning": {"enabled": false}}
  defined_in: llm.py ROUTE_EXTRA_BODY
  probed: "2026-10-03"
  why: "reasoning off, probed with a tool call"
price_usd_per_mtok: [2.5, 7.5]  # input, output
price_note: "Together's list price, looked up per call"
env: {}  # extra harness environment (HARNESS_OPENAI_COMPAT, HARNESS_OPENAI_EFFORT, HARNESS_PRICES); no keys
budget_usd: 190  # spend cap for one full pass (three test seeds): the model, partners, judges and readings
evaluation:
  scored_set: benchmark/final_set.json
  runs: ["2026-10-03", "2026-10-06"]  # first and last day (UTC) of the scored runs
  benchmark_version: "3.0.0"
  card: results/cards/qwen-3.7-max.json
notes: "Not scored on taking over, and cannot be re-run: Together AI now requires third-party data sharing to call it, which the project keeps off. Its score is over the other seven dimensions."
