name: Model submission
description: Ask to have a model scored on all 240 scenarios, including the held-out set
title: "Model submission: "
labels: ["model submission"]
body:
  - type: markdown
    attributes:
      value: |
        See [getting a model scored on the held-out set](https://github.com/zou-group/collaborative-intelligence/blob/main/docs/submit.md).
        **Do not paste an API key here.** If we need a key, we ask you to send it through a one-time secret link.
  - type: input
    id: model
    attributes:
      label: Model
      description: The model's name and version, as you want it shown on the leaderboard.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: How to call it
      description: The provider (Anthropic, OpenAI, Together AI, OpenRouter) and model id, or an OpenAI-compatible chat endpoint that supports tool calls. No keys.
    validations:
      required: true
  - type: input
    id: reasoning
    attributes:
      label: Reasoning setting
      description: The leaderboard runs every model at the lightest reasoning setting its API offers. Name another setting if you want it scored as well.
  - type: dropdown
    id: publish
    attributes:
      label: Publishing the result
      options:
        - Publish when the runs are done
        - Hold until the model is released (give the date below)
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact
      description: Who we should talk to about the runs and the result.
    validations:
      required: true
